name: Build Reel Scheduler APK

on:
  push:
    branches: [ reel-scheduler-apk-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode source
        run: |
          base64 -d reelscheduler-source.b64 > reelscheduler.zip
          unzip -q reelscheduler.zip
      - name: Build debug APK
        working-directory: ReelSchedulerAndroid
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReelScheduler-debug-apk
          path: ReelSchedulerAndroid/app/build/outputs/apk/debug/app-debug.apk
