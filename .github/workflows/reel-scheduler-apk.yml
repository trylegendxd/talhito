name: Build Reel Scheduler Background APK

on:
  push:
    branches: [ reel-scheduler-apk-build ]
  workflow_dispatch:

concurrency:
  group: reel-scheduler-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode source
        run: |
          cat reelscheduler-source.part* > reelscheduler-full.b64
          test "$(wc -c < reelscheduler-full.b64)" -eq 29196
          base64 -d reelscheduler-full.b64 > reelscheduler.zip
          unzip -t reelscheduler.zip
          unzip -q reelscheduler.zip

      - name: Apply recipient auto-select fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/InstagramAccessibilityService.kt')
          s = p.read_text()
          s = s.replace('findExactOrContains(root, job.recipient)', 'findRecipientResult(root, job.recipient)')
          replacement = r'''    private fun findRecipientResult(root: AccessibilityNodeInfo, text: String): AccessibilityNodeInfo? {
                  val target = text.trim().removePrefix("@").lowercase(Locale.ROOT)
                  if (target.isBlank()) return null
                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)
                  var fallback: AccessibilityNodeInfo? = null
                  while (queue.isNotEmpty()) {
                      val n = queue.removeFirst()
                      if (!n.isEditable && hasClickableSelfOrParent(n)) {
                          for (label in labels(n)) {
                              val clean = label.removePrefix("@").trim()
                              if (clean == target) return n
                              if (fallback == null && clean.contains(target)) fallback = n
                          }
                      }
                      for (i in 0 until n.childCount) n.getChild(i)?.let(queue::add)
                  }
                  return fallback
              }

              private fun hasClickableSelfOrParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  repeat(6) {
                      if (current?.isClickable == true) return true
                      current = current?.parent
                  }
                  return false
              }

'''
          s = re.sub(r'    private fun findExactOrContains\(.*?\n    private fun findEditable', replacement + '    private fun findEditable', s, flags=re.S)
          s = s.replace('handler.postDelayed({ scan() }, 900)\n                }\n            }\n            Step.FIND_RECIPIENT ->', 'handler.postDelayed({ scan() }, 1200)\n                }\n            }\n            Step.FIND_RECIPIENT ->')
          p.write_text(s)
          PY

      - name: Add background reliability
        run: |
          cat > ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/BootReceiver.kt <<'KOTLIN'
          package com.rushx.reelscheduler

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val action = intent?.action ?: return
                  if (action != Intent.ACTION_BOOT_COMPLETED && action != Intent.ACTION_MY_PACKAGE_REPLACED) return

                  if (!AlarmScheduler.canScheduleExact(context)) {
                      Notifier.show(context, "Reel Scheduler needs attention", "Allow Alarms & reminders again so scheduled Reels can run in the background.")
                      return
                  }

                  val repo = JobRepository(context)
                  val now = System.currentTimeMillis()
                  repo.all()
                      .filter { it.status == ScheduledReel.STATUS_SCHEDULED || it.status == ScheduledReel.STATUS_WAITING_UNLOCK }
                      .forEach { job ->
                          val trigger = if (job.triggerAtMillis > now) job.triggerAtMillis else now + 5_000L
                          val restored = job.copy(triggerAtMillis = trigger, status = ScheduledReel.STATUS_SCHEDULED)
                          repo.upsert(restored)
                          AlarmScheduler.schedule(context, restored)
                      }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/TriggerActivity.kt')
          s = p.read_text()
          if 'android.view.WindowManager' not in s:
              s = s.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.view.WindowManager\n')
          if 'FLAG_TURN_SCREEN_ON' not in s:
              s = s.replace('        super.onCreate(savedInstanceState)\n', '        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n')
          p.write_text(s)
          PY

          cat > ReelSchedulerAndroid/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <queries>
                  <package android:name="com.instagram.android" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Reel Scheduler"
                  android:theme="@style/Theme.ReelScheduler">

                  <activity
                      android:name=".TriggerActivity"
                      android:excludeFromRecents="true"
                      android:exported="false"
                      android:noHistory="true"
                      android:turnScreenOn="true"
                      android:theme="@style/Theme.ReelScheduler.Trigger" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".InstagramAccessibilityService"
                      android:exported="false"
                      android:label="Reel Scheduler automation"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          XML

          sed -i 's/versionCode = 1/versionCode = 2/' ReelSchedulerAndroid/app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "0.2.0-background"/' ReelSchedulerAndroid/app/build.gradle.kts

      - name: Apply Android theme hotfix
        run: |
          sed -i 's#parent="Theme.AppCompat.Translucent.NoActionBar"#parent="Theme.AppCompat.DayNight.NoActionBar"#' ReelSchedulerAndroid/app/src/main/res/values/styles.xml

      - name: Build debug APK
        working-directory: ReelSchedulerAndroid
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ReelScheduler-background-apk
          path: ReelSchedulerAndroid/app/build/outputs/apk/debug/app-debug.apk
