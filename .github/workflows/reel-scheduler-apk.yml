name: Build Reel Scheduler APK

on:
  push:
    branches: [ reel-scheduler-apk-build ]
  workflow_dispatch:

concurrency:
  group: reel-scheduler-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode source
        run: |
          cat reelscheduler-source.part* > reelscheduler-full.b64
          test "$(wc -c < reelscheduler-full.b64)" -eq 29196
          base64 -d reelscheduler-full.b64 > reelscheduler.zip
          unzip -t reelscheduler.zip
          unzip -q reelscheduler.zip
      - name: Apply Android theme hotfix
        run: |
          sed -i 's#parent="Theme.AppCompat.Translucent.NoActionBar"#parent="Theme.AppCompat.DayNight.NoActionBar"#' ReelSchedulerAndroid/app/src/main/res/values/styles.xml
      - name: Build debug APK
        working-directory: ReelSchedulerAndroid
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ReelScheduler-debug-apk
          path: ReelSchedulerAndroid/app/build/outputs/apk/debug/app-debug.apk
