name: Inspect Reel Scheduler service

on:
  push:
    branches: [ reel-scheduler-apk-build ]

concurrency:
  group: reel-scheduler-apk-build
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source
        run: |
          cat reelscheduler-source.part* > reelscheduler-full.b64
          base64 -d reelscheduler-full.b64 > reelscheduler.zip
          unzip -q reelscheduler.zip
      - name: Print Instagram automation source
        run: |
          echo '===== InstagramAccessibilityService.kt ====='
          cat ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/InstagramAccessibilityService.kt
