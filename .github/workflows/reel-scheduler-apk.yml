name: Build Reel Scheduler v0.3 APK

on:
  push:
    branches: [ reel-scheduler-apk-build ]
  workflow_dispatch:

concurrency:
  group: reel-scheduler-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode base source
        run: |
          cat reelscheduler-source.part* > reelscheduler-full.b64
          test "$(wc -c < reelscheduler-full.b64)" -eq 29196
          base64 -d reelscheduler-full.b64 > reelscheduler.zip
          unzip -t reelscheduler.zip
          unzip -q reelscheduler.zip

      - name: Apply v0.3 background patches
        run: |
          cp reel-v3-patches/AlarmScheduler.kt ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/AlarmScheduler.kt
          cp reel-v3-patches/AlarmReceiver.kt ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/AlarmReceiver.kt
          cp reel-v3-patches/InstagramAccessibilityService.kt ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/InstagramAccessibilityService.kt
          cp reel-v3-patches/BootReceiver.kt ReelSchedulerAndroid/app/src/main/java/com/rushx/reelscheduler/BootReceiver.kt
          cp reel-v3-patches/AndroidManifest.xml ReelSchedulerAndroid/app/src/main/AndroidManifest.xml
          python3 reel-v3-patches/patch_main.py
          sed -i 's/versionCode = 1/versionCode = 3/' ReelSchedulerAndroid/app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "0.3.0-background-direct"/' ReelSchedulerAndroid/app/build.gradle.kts
          sed -i 's#parent="Theme.AppCompat.Translucent.NoActionBar"#parent="Theme.AppCompat.DayNight.NoActionBar"#' ReelSchedulerAndroid/app/src/main/res/values/styles.xml

      - name: Build debug APK
        working-directory: ReelSchedulerAndroid
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ReelScheduler-v0.3-background-direct-apk
          path: ReelSchedulerAndroid/app/build/outputs/apk/debug/app-debug.apk
